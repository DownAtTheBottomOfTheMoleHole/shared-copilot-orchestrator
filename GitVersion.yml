mode: ContinuousDelivery
next-version: 1.1.0
tag-prefix: '^v'
commit-message-incrementing: Enabled
major-version-bump-message: '(?is)(^[a-z][a-z0-9-]*(\([^)]+\))?!:|BREAKING CHANGE:)'
minor-version-bump-message: '(?i)^feat(\([^)]+\))?:'
patch-version-bump-message: '(?i)^(fix|perf)(\([^)]+\))?:'
no-bump-message: '(?i)^(docs|style|test|build|ci|chore)(\([^)]+\))?:'
branches:
  main:
    regex: ^main$
    increment: Patch
    label: ''
  feature:
    regex: ^(?:features?[/-]|(?!(?:hotfix(?:es)?|releases?|support|pull(?:-requests?)?)/)[^/]+/)
    increment: Minor
    label: alpha
  hotfix:
    regex: ^hotfix(es)?[/-]
    increment: Patch
    label: hotfix
ignore:
  sha: []
