name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.8.2

      - name: Set up Python
        uses: actions/setup-python@42375524cb85302667ca4f0f2a32c4a7a73c0384 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Prepare release GitVersion config
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path("GitVersion.yml").read_text(encoding="utf-8"))

          if isinstance(config, dict) and str(config.get("mode")) in {"MainLine", "Mainline"}:
              config["mode"] = "ContinuousDelivery"

          branches = config.get("branches") if isinstance(config, dict) else None
          if isinstance(branches, dict):
              for branch in branches.values():
                  if isinstance(branch, dict):
                      if str(branch.get("mode")) in {"MainLine", "Mainline"}:
                          branch.pop("mode", None)
                      if "is-mainline" in branch:
                          branch.pop("is-mainline", None)

          output = Path(os.environ["RUNNER_TEMP"]) / "GitVersion.release.yml"
          output.write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
          print(f"Wrote {output}")
          PY

      - name: Calculate version with GitVersion
        id: gitversion
        uses: GitTools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          configFilePath: ${{ runner.temp }}/GitVersion.release.yml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.gitversion.outputs.majorMinorPatch }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; skipping."
          else
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
