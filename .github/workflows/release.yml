name: Release

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Only a successful push-to-main Quality run can release. PR runs of
    # Quality must never cause a privileged release run.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm Quality tested the current main commit
        id: candidate
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/release-candidate.sh

      - name: Set up Node.js
        if: steps.candidate.outputs.publish == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run tests before publishing
        if: steps.candidate.outputs.publish == 'true'
        run: node --test tests/*.test.js

      - name: Install pinned GitVersion
        if: steps.candidate.outputs.publish == 'true'
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: '6.8.2'

      - name: Calculate version with GitVersion
        if: steps.candidate.outputs.publish == 'true'
        id: gitversion
        uses: GitTools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          configFilePath: GitVersion.yml

      - name: Publish GitHub release
        if: steps.candidate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ ! "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::GitVersion returned '${VERSION}', which is not a MAJOR.MINOR.PATCH version."
            exit 1
          fi
          release_tag="v${VERSION}"

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists; nothing to publish." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null; then
            echo "Tag ${release_tag} exists without a release; publishing a release for the existing tag."
            gh release create "${release_tag}" --verify-tag --title "${release_tag}" --generate-notes
            echo "Published ${release_tag} from the existing tag." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # Guard against the GitVersion Fallback strategy (for example, if
          # tags were not fetched) producing a version below the latest release.
          latest_tag="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -n "${latest_tag}" ]]; then
            highest="$(printf '%s\n%s\n' "${latest_tag#v}" "${VERSION}" | sort -V | tail -n 1)"
            if [[ "${highest}" != "${VERSION}" ]]; then
              echo "::error::Calculated ${release_tag} is older than the latest tag ${latest_tag}. Check GitVersion.yml and tag history."
              exit 1
            fi
          fi

          gh release create "${release_tag}" \
            --target "${RELEASE_SHA}" \
            --title "${release_tag}" \
            --generate-notes
          echo "Published ${release_tag} at ${RELEASE_SHA}." >> "${GITHUB_STEP_SUMMARY}"
