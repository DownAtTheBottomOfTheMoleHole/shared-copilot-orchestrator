name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.8.2

      - name: Prepare release GitVersion config
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path("GitVersion.yml").read_text(encoding="utf-8")
          source = re.sub(
              r"(?m)^mode:\s*Main[Ll]ine\s*$",
              "mode: ContinuousDelivery",
              source,
              count=1,
          )
          source = re.sub(r"(?m)^[ \t]+mode:\s*Main[Ll]ine\s*\r?\n", "", source)
          source = re.sub(r"(?m)^[ \t]+is-mainline:\s*(?:true|false)\s*\r?\n", "", source)

          output = Path(os.environ["RUNNER_TEMP"]) / "GitVersion.release.yml"
          output.write_text(source, encoding="utf-8")
          print(f"Wrote {output}")
          PY

      - name: Calculate version with GitVersion
        id: gitversion
        uses: GitTools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          configFilePath: ${{ runner.temp }}/GitVersion.release.yml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.gitversion.outputs.majorMinorPatch }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; skipping."
          else
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
