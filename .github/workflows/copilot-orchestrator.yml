name: Copilot Orchestrator (deprecated reusable workflow)

on:
  workflow_call:
    inputs:
      target_repository:
        description: Deprecated caller repository input
        required: true
        type: string
      target_pr_number:
        description: Deprecated pull request number input
        required: true
        type: string
      target_sha:
        description: Deprecated reviewed commit SHA input
        required: true
        type: string
      review_payload:
        description: Deprecated review payload input
        required: false
        type: string
        default: ''
      assign_copilot:
        description: Deprecated assignment input
        required: false
        type: boolean
        default: true
    secrets:
      target_repo_token:
        description: Deprecated and ignored
        required: false
      COPILOT_ORCHESTRATOR_ENV_TOKEN:
        description: Deprecated and ignored
        required: false
    outputs:
      issue_url:
        description: Empty because the legacy entry point is disabled
        value: ${{ jobs.disabled.outputs.issue_url }}
      actionable_count:
        description: Zero because the legacy entry point is disabled
        value: ${{ jobs.disabled.outputs.actionable_count }}
      copilot_assigned:
        description: False because the legacy entry point is disabled
        value: ${{ jobs.disabled.outputs.copilot_assigned }}

jobs:
  disabled:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      issue_url: ${{ steps.skip.outputs.issue_url }}
      actionable_count: ${{ steps.skip.outputs.actionable_count }}
      copilot_assigned: ${{ steps.skip.outputs.copilot_assigned }}
    steps:
      - name: Explain migration to the protected composite action
        id: skip
        run: |
          echo 'issue_url=' >> "${GITHUB_OUTPUT}"
          echo 'actionable_count=0' >> "${GITHUB_OUTPUT}"
          echo 'copilot_assigned=false' >> "${GITHUB_OUTPUT}"
          echo 'Copilot handoff skipped: this reusable workflow is deprecated. Use the SHA-pinned composite action from a trusted workflow_run job in the copilot-orchestrator environment.' >> "${GITHUB_STEP_SUMMARY}"
