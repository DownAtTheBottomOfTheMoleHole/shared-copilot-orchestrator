name: Copilot Orchestrator

on:
  workflow_call:
    inputs:
      target_repository:
        description: owner/repo that should receive the generated issue
        required: true
        type: string
      target_pr_number:
        description: pull request number in the target repository
        required: true
        type: string
      target_sha:
        description: commit SHA associated with the findings
        required: true
        type: string
      review_payload:
        description: serialized review payload to parse
        required: false
        type: string
        default: ""

jobs:
  create-copilot-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read
    steps:
      - name: Check out central orchestrator repository
        uses: actions/checkout@v4
        with:
          repository: DownAtTheBottomOfTheMoleHole/shared-copilot-orchestrator
          path: orchestrator
          fetch-depth: 1

      - name: Parse and sanitize review payload
        id: parse
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_PR_NUMBER: ${{ inputs.target_pr_number }}
          TARGET_SHA: ${{ inputs.target_sha }}
          REVIEW_PAYLOAD: ${{ inputs.review_payload }}
        run: node orchestrator/scripts/parse-review.js

      - name: Create issue in caller repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          ISSUE_TITLE: ${{ steps.parse.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.parse.outputs.issue_body }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          printf '%s\n' "${ISSUE_BODY}" > "${body_file}"
          gh issue create \
            --repo "${TARGET_REPOSITORY}" \
            --title "${ISSUE_TITLE}" \
            --body-file "${body_file}"
