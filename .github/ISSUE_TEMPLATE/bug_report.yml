name: Bug report
description: Report a reproducible problem with the orchestrator.
title: "fix: "
labels:
  - Bug
body:
  - type: markdown
    attributes:
      value: Before reporting a vulnerability, use the private security advisory link instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the failure and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the caller workflow configuration and relevant event details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, secrets, and sensitive repository data before sharing.
    validations:
      required: false
